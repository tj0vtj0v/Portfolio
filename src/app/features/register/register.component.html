<div class="form-page">
    <app-ui-page-header eyebrow="Account" heading="Register" description="Create an account for access to the private workspace." />
    <app-ui-panel>
        <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Creating account…" />
        <form [attr.aria-busy]="submission.pending" (ngSubmit)="onRegister()" *ngIf="!success">
            <div class="form-grid">
                <div class="form-field"><label for="first_name">First Name</label><input [disabled]="submission.pending" [(ngModel)]="user.first_name" id="first_name" name="first_name" autocomplete="given-name" required [appFieldError]="fieldErrors['first_name']" /></div>
                <div class="form-field"><label for="last_name">Last Name</label><input [disabled]="submission.pending" [(ngModel)]="user.last_name" id="last_name" name="last_name" autocomplete="family-name" required [appFieldError]="fieldErrors['last_name']" /></div>
                <div class="form-field form-field--wide"><label for="email">Email</label><input [disabled]="submission.pending" [(ngModel)]="user.email" id="email" name="email" autocomplete="email" required type="email" [appFieldError]="fieldErrors['email']" /></div>
                <div class="form-field form-field--wide"><label for="username">Username</label><input [disabled]="submission.pending" [(ngModel)]="user.username" id="username" name="username" autocomplete="username" required [appFieldError]="fieldErrors['username']" /></div>
                <div class="form-field"><label for="password">Password</label><input [disabled]="submission.pending" [(ngModel)]="user.password" id="password" name="password" autocomplete="new-password" required type="password" [appFieldError]="fieldErrors['password']" /></div>
                <div class="form-field"><label for="repeatPassword">Repeat Password</label><input [disabled]="submission.pending" [(ngModel)]="repeatPassword" id="repeatPassword" name="repeatPassword" autocomplete="new-password" required type="password" [appFieldError]="fieldErrors['repeatPassword']" /></div>
            </div>
            <div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Register</button><a routerLink="/login">Back to login</a></div>
        </form>
        <div *ngIf="statusMessage || success" class="registration-result" [class.registration-result--error]="!success">
            <app-ui-feedback *ngIf="statusMessage" [kind]="feedbackKind" [message]="statusMessage" />
            <div *ngIf="success" class="registration-result-actions">
                <a class="button" data-variant="primary" routerLink="/login">Continue to login</a>
            </div>
        </div>
    </app-ui-panel>
</div>
