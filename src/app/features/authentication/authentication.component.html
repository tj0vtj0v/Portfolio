<div class="form-page form-page--narrow">
    <app-ui-page-header eyebrow="Account" heading="Login" description="Sign in to open your private workspace." />
    <app-ui-panel>
        <a class="retry-link" *ngIf="returnUrl && (sessionCheckFailed || userService.isLoggedIn())" [routerLink]="returnUrl">Retry opening your page</a>
        <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Signing in…" />
        <form [attr.aria-busy]="submission.pending" (ngSubmit)="onLogin()" *ngIf="!userService.isLoggedIn()">
            <div class="form-field">
                <label for="username">Username</label>
                <input [disabled]="submission.pending" [(ngModel)]="username" id="username" name="username" autocomplete="username" required type="text" [appFieldError]="fieldErrors['username']" />
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input [disabled]="submission.pending" [(ngModel)]="password" id="password" name="password" autocomplete="current-password" required type="password" [appFieldError]="fieldErrors['password']" />
            </div>
            <div class="form-actions">
                <button data-variant="primary" [disabled]="submission.pending" type="submit">Login</button>
                <a routerLink="/register">Create an account</a>
            </div>
        </form>
        <app-ui-feedback *ngIf="statusMessage" [kind]="feedbackKind" [message]="statusMessage" />
    </app-ui-panel>
</div>
