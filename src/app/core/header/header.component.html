<header class="topbar">
    <a class="name" routerLink="/home">Tjorven Burdorf</a>

    <nav class="view-switch" aria-label="Site area">
        <a [routerLink]="portfolioLink" [attr.aria-current]="shell === 'portfolio' ? 'page' : null" [class.active]="shell === 'portfolio'">Portfolio</a>
        <a [routerLink]="workspaceLink" [attr.aria-current]="shell === 'workspace' ? 'page' : null" [class.active]="shell === 'workspace'">Workspace</a>
    </nav>

    <div class="topbar-actions">
        <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" [attr.aria-pressed]="theme.theme() === 'dark'">
            <span aria-hidden="true">{{ theme.theme() === 'dark' ? '☾' : '☼' }}</span>
            <span class="theme-label">{{ theme.theme() === 'dark' ? 'Dark' : 'Light' }}</span>
        </button>

        @if (auth.isLoggedIn()) {
            <details class="account-menu">
                <summary aria-label="Open account menu">Account</summary>
                <div class="account-menu-panel">
                    <a routerLink="/settings">Settings</a>
                    <a routerLink="/account">Account</a>
                    <button type="button" (click)="logout()">Logout</button>
                </div>
            </details>
        } @else {
            <a class="login-link" routerLink="/login">Login</a>
        }
    </div>
</header>
