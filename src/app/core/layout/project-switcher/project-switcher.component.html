<aside class="project-sidebar">
    <app-ui-select id="workspace-project" name="Project" placeholder="Choose project"
        [options]="projects" [ngModel]="selected" (ngModelChange)="selectProject($event)" />

    @if (selected; as current) {
        <nav class="project-nav" [attr.aria-label]="current.name + ' navigation'">
            @for (item of current.children; track item.path; let first = $first) {
                <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: first}" ariaCurrentWhenActive="page"
                   [class.setup-needed]="needsSetup(item.path)" [attr.title]="needsSetup(item.path) ? 'No ' + item.label.toLowerCase() + ' yet. Add your first one.' : null">{{ item.label }}</a>
            }
        </nav>
    } @else {
        <p class="project-hint">Choose a project to open its navigation.</p>
    }
</aside>
