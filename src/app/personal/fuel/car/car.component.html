<p *ngIf="submission.pending" role="status">Saving changes…</p>
<div *ngIf="!(car || addingCar)">
    <ag-grid-angular
        appGridFit
        (rowClicked)="onRowClicked($event)"
        [columnDefs]="columnDefs"
        [domLayout]="'autoHeight'"
        [paginationPageSizeSelector]="[10, 20, 50]"
        [paginationPageSize]="10"
        [pagination]="true"
        [rowData]="cars"
        class="ag-theme-alpine"
        style="width: 100%; height: 100%;"
    />
    <button [disabled]="submission.pending" (click)="onAdd()">Add Car</button>
</div>

<div *ngIf="addingCar">
    <h3>Add Car</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()">
        <div>
            <label for="add_name">Name</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.name" id="add_name" name="add_name" placeholder="Enter the car name" required
                   type="text"/>
        </div>
        <div>
            <label for="add_start">Start usage</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.usage_start" id="add_start" name="add_start" required type="date"/>
        </div>
        <div>
            <label for="add_end">End usage</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.usage_end" id="add_end" name="add_end" type="date"/>
        </div>

        <button [disabled]="submission.pending" type="submit">Save</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>

<div *ngIf="!addingCar && car">
    <h3>Edit Car: {{ carName }}</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()">
        <div>
            <label for="name">Name</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.name" id="name" name="name" required type="text"/>
        </div>
        <div>
            <label for="start">Start usage</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.usage_start" id="start" name="start" required type="date"/>
        </div>
        <div>
            <label for="end">End usage</label>
            <input [disabled]="submission.pending" [(ngModel)]="car!.usage_end" id="end" name="end" type="date"/>
        </div>

        <button [disabled]="submission.pending" type="submit">Update</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>
    <button [disabled]="submission.pending" (click)="onDelete()">Delete Car</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>
