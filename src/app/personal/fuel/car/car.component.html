<div class="fuel-page">
    <app-ui-page-header eyebrow="Fuel" heading="Vehicles" description="Manage the vehicles available for refuelling.">
        <button *ngIf="!(car || addingCar) && !loading && !loadError" data-variant="primary" type="button" (click)="onAdd()">Add vehicle</button>
    </app-ui-page-header>
    <app-ui-feedback *ngIf="successMessage" kind="success" [message]="successMessage" />
    <app-ui-skeleton *ngIf="loading" layout="table" message="Loading vehicles…" />
    <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Saving changes…" />
    <app-ui-feedback *ngIf="loadError" kind="error" [message]="loadError" />
    <button *ngIf="loadError" type="button" (click)="loadData()">Retry</button>
    <app-ui-empty-state *ngIf="!loading && !loadError && !(car || addingCar) && !cars.length" heading="No vehicles" message="No vehicles have been added yet." />
    <app-ui-panel *ngIf="!loading && !loadError && !(car || addingCar) && cars.length" heading="Vehicles"><div class="grid-wrap"><ag-grid-angular appGridFit (appGridActivate)="onRowClicked($event)" [columnDefs]="columnDefs" [domLayout]="'autoHeight'" [paginationPageSizeSelector]="[10,20,50]" [paginationPageSize]="10" [pagination]="true" [rowData]="cars" style="width:100%;height:100%" /></div></app-ui-panel>

    <app-ui-panel *ngIf="addingCar" heading="Add vehicle"><form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()"><ng-container *ngTemplateOutlet="carFields; context: {$implicit: 'add_'}" /><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Save vehicle</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div></form><app-ui-feedback *ngIf="statusMessage" kind="error" [message]="statusMessage" /></app-ui-panel>
    <app-ui-panel *ngIf="!addingCar && car" heading="Edit vehicle"><form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()"><ng-container *ngTemplateOutlet="carFields; context: {$implicit: ''}" /><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Update vehicle</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div><div class="destructive-section"><button data-variant="danger" [disabled]="submission.pending" type="button" (click)="onDelete()">Delete vehicle</button></div></form><app-ui-feedback *ngIf="statusMessage" kind="error" [message]="statusMessage" /></app-ui-panel>
</div>

<ng-template #carFields let-prefix><div class="form-grid">
    <div class="form-field form-field--wide"><label [for]="prefix + 'name'">Name</label><input [disabled]="submission.pending" [(ngModel)]="car!.name" [id]="prefix + 'name'" name="name" required type="text" [appFieldError]="fieldErrors['name']"></div>
    <div class="form-field"><label [for]="prefix + 'start'">Usage start</label><input [disabled]="submission.pending" [(ngModel)]="car!.usage_start" [id]="prefix + 'start'" name="usage_start" required type="date" [appFieldError]="fieldErrors['usage_start']"></div>
    <div class="form-field"><label [for]="prefix + 'end'">Usage end</label><input [disabled]="submission.pending" [(ngModel)]="car!.usage_end" [id]="prefix + 'end'" name="usage_end" type="date" [appFieldError]="fieldErrors['usage_end']"></div>
</div></ng-template>
