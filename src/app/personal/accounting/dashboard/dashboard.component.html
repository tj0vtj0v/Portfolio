<div>
    <h1>Dashboard</h1>
    <div>
        <label for="start">Start Date:</label>
        <input (change)="update()" [(ngModel)]="startDate" id="start" name="start" required type="date"/>

        <label for="end">End Date:</label>
        <input (change)="update()" [(ngModel)]="endDate" id="end" name="end" required type="date"/>
    </div>


    <p *ngIf="loading" role="status">Loading dashboard…</p>
    <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <app-chart-card [options]="charts.balance"></app-chart-card>
    <app-chart-card [options]="charts.history"></app-chart-card>
    <app-chart-card [options]="charts.category_expense"></app-chart-card>
    <app-chart-card [options]="charts.account_income"></app-chart-card>
    <app-chart-card [options]="charts.transfer"></app-chart-card>
</div>
