<div class="accounting-page">
    <app-ui-page-header heading="Expenses" description="Manage your spending."><app-amount-privacy-toggle title-actions />
        <button *ngIf="!(expense || addingExpense) && !loading && !loadError" data-variant="primary" type="button" (click)="onAdd()">Add expense</button>
    </app-ui-page-header>
    <app-ui-skeleton *ngIf="loading" layout="table" message="Loading expenses..." />
    <app-ui-feedback *ngIf="loadError" kind="error" [message]="loadError" />
    <button *ngIf="loadError" type="button" (click)="load()">Retry</button>
    <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Saving changes…" />
    <app-ui-feedback *ngIf="!loading && !loadError && !expenses.length && !expense" kind="info" message="No expenses have been recorded." />
    <app-ui-panel *ngIf="!(expense || addingExpense) && !loading && !loadError" heading="Expense records">
        <div panel-actions class="grid-toolbar"><button type="button" class="filter-reset" title="Reset filters to current month" aria-label="Reset filters to current month" (click)="resetFilters()"><span aria-hidden="true">↺</span> Reset filters</button></div>
        <div class="grid-wrap"><ag-grid-angular appGridFit (gridReady)="onGridReady($event)" (filterChanged)="saveGridFilters($event.api)" (appGridActivate)="onRowClicked($event)" [columnDefs]="columnDefs" [domLayout]="'autoHeight'" [paginationPageSizeSelector]="[10, 50, 100, 1000]" [paginationPageSize]="50" [pagination]="true" [rowData]="expenses" style="width:100%;height:100%" /></div>
    </app-ui-panel>
    <app-ui-panel *ngIf="addingExpense" heading="Add expense">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()">
            <div class="form-grid">
                <div class="form-field"><label for="add_date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="expense!.date" id="add_date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
                <div class="form-field"><label for="add_amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="expense!.amount" id="add_amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
                <div class="form-field form-field--wide"><label for="add_reason">Reason</label><input [disabled]="submission.pending" [(ngModel)]="expense!.reason" id="add_reason" name="reason" required type="text" [appFieldError]="fieldErrors['reason']"></div>
                <div class="form-field"><label for="add_account">Account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="expense!.account" id="add_account" name="account" required placeholder="Choose an account" [options]="accounts" [appFieldError]="fieldErrors['account']" /></div>
                <div class="form-field"><label for="add_category">Category</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="expense!.category" id="add_category" name="category" required placeholder="Choose a category" [options]="categories" [appFieldError]="fieldErrors['category']" /></div>
            </div>
            <div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Save expense</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div>
        </form>
    </app-ui-panel>
    <app-ui-panel *ngIf="!addingExpense && expense" heading="Edit expense">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()">
            <div class="form-grid">
                <div class="form-field"><label for="date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="expense.date" id="date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
                <div class="form-field"><label for="amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="expense.amount" id="amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
                <div class="form-field form-field--wide"><label for="reason">Reason</label><input [disabled]="submission.pending" [(ngModel)]="expense.reason" id="reason" name="reason" required type="text" [appFieldError]="fieldErrors['reason']"></div>
                <div class="form-field"><label for="account">Account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="expense.account" id="account" name="account" required placeholder="Choose an account" [options]="accounts" [appFieldError]="fieldErrors['account']" /></div>
                <div class="form-field"><label for="category">Category</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="expense.category" id="category" name="category" required placeholder="Choose a category" [options]="categories" [appFieldError]="fieldErrors['category']" /></div>
            </div>
            <div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Update expense</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div>
            <div class="destructive-section"><button data-variant="danger" [disabled]="submission.pending" type="button" (click)="onDelete()">Delete expense</button></div>
        </form>
    </app-ui-panel>
</div>
