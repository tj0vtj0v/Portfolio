<div class="accounting-page">
    <app-ui-page-header heading="Categories" description="Group expenses into categories based on what they were for."><app-amount-privacy-toggle title-actions /><button *ngIf="!(category || addingCategory) && !loading && !loadError" data-variant="primary" type="button" (click)="onAdd()">Add category</button></app-ui-page-header>
    <app-ui-skeleton *ngIf="loading" layout="table" message="Loading categories..." />
    <app-ui-feedback *ngIf="loadError" kind="error" [message]="loadError" />
    <button *ngIf="loadError" type="button" (click)="load()">Retry</button>
    <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Saving changes…" />
    <app-ui-feedback *ngIf="!loading && !loadError && !categories.length && !category" kind="info" message="No categories yet. Create one to get started." />
    <app-ui-panel *ngIf="!(category || addingCategory) && !loading && !loadError" heading="Expense categories"><div panel-actions class="grid-toolbar"><button type="button" class="filter-reset" title="Clear all filters" aria-label="Clear all filters" (click)="resetFilters()"><span aria-hidden="true">↺</span> Reset filters</button></div><div class="grid-wrap"><ag-grid-angular appGridFit (gridReady)="onGridReady($event)" (filterChanged)="saveGridFilters($event.api)" (appGridActivate)="onRowClicked($event)" [columnDefs]="columnDefs" [domLayout]="'autoHeight'" [paginationPageSizeSelector]="[10,50,100,1000]" [paginationPageSize]="50" [pagination]="true" [rowData]="categories" style="width:100%;height:100%" /></div></app-ui-panel>
    <app-ui-panel *ngIf="addingCategory" heading="Add category">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()"><div class="form-grid"><div class="form-field form-field--wide"><label for="add_name">Name</label><input [disabled]="submission.pending" [(ngModel)]="category!.name" id="add_name" name="name" required type="text" [appFieldError]="fieldErrors['name']"></div></div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Save category</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div></form>
    </app-ui-panel>
    <app-ui-panel *ngIf="!addingCategory && category" heading="Edit category">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()"><div class="form-grid"><div class="form-field form-field--wide"><label for="name">Name</label><input [disabled]="submission.pending" [(ngModel)]="category.name" id="name" name="name" required type="text" [appFieldError]="fieldErrors['name']"></div></div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Update category</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div><div class="destructive-section"><button data-variant="danger" [disabled]="submission.pending" type="button" (click)="onDelete()">Delete category</button></div></form>
    </app-ui-panel>
</div>
