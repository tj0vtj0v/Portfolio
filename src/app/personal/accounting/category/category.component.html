<p *ngIf="submission.pending" role="status">Saving changes…</p>
<div *ngIf="!(category || addingCategory)">
    <ag-grid-angular
        appGridFit
        (rowClicked)="onRowClicked($event)"
        [columnDefs]="columnDefs"
        [domLayout]="'autoHeight'"
        [paginationPageSizeSelector]="[10, 20, 50]"
        [paginationPageSize]="10"
        [pagination]="true"
        [rowData]="categories"
        class="ag-theme-alpine"
        style="width: 100%; height: 100%;"
    />
    <button [disabled]="submission.pending" (click)="onAdd()">Add Category</button>
</div>

<div *ngIf="addingCategory">
    <h3>Add Category</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()">
        <div>
            <label for="add_name">Name</label>
            <input [disabled]="submission.pending" [(ngModel)]="category!.name" id="add_name" name="add_name" placeholder="Enter the category name"
                   required type="text"/>
        </div>

        <button [disabled]="submission.pending" type="submit">Save</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>

<div *ngIf="!addingCategory && category">
    <h3>Edit Category: {{ categoryName }}</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()">
        <div>
            <label for="name">Name</label>
            <input [disabled]="submission.pending" [(ngModel)]="category.name" id="name" name="name" required type="text"/>
        </div>

        <button [disabled]="submission.pending" type="submit">Update</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>
    <button [disabled]="submission.pending" (click)="onDelete()">Delete Category</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>
