<div class="accounting-page">
    <app-ui-page-header heading="Transfers" description="Track transactions between your own accounts."><app-amount-privacy-toggle title-actions /><button *ngIf="!(transfer || addingTransfer) && !loading && !loadError" data-variant="primary" type="button" (click)="onAdd()">Add transfer</button></app-ui-page-header>
    <app-ui-skeleton *ngIf="loading" layout="table" message="Loading transfers..." />
    <app-ui-feedback *ngIf="loadError" kind="error" [message]="loadError" />
    <button *ngIf="loadError" type="button" (click)="load()">Retry</button>
    <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Saving changes…" />
    <app-ui-feedback *ngIf="!loading && !loadError && !transfers.length && !transfer" kind="info" message="No transfers have been recorded." />
    <app-ui-panel *ngIf="!(transfer || addingTransfer) && !loading && !loadError" heading="Transfer records"><div panel-actions class="grid-toolbar"><button type="button" class="filter-reset" title="Reset filters to current month" aria-label="Reset filters to current month" (click)="resetFilters()"><span aria-hidden="true">↺</span> Reset filters</button></div><div class="grid-wrap"><ag-grid-angular appGridFit (gridReady)="onGridReady($event)" (filterChanged)="saveGridFilters($event.api)" (appGridActivate)="onRowClicked($event)" [columnDefs]="columnDefs" [domLayout]="'autoHeight'" [paginationPageSizeSelector]="[10,50,100,1000]" [paginationPageSize]="50" [pagination]="true" [rowData]="transfers" style="width:100%;height:100%" /></div></app-ui-panel>
    <app-ui-panel *ngIf="addingTransfer" heading="Transfer between accounts">
        <p class="editor-copy">Track transactions between your own accounts. Transfers do not count as income or expenses.</p>
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()"><div class="form-grid">
            <div class="form-field"><label for="add_date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="transfer!.date" id="add_date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
            <div class="form-field"><label for="add_amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="transfer!.amount" id="add_amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
            <div class="form-field"><label for="add_source">Source account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="transfer!.source" id="add_source" name="source" required placeholder="Choose a source" [options]="accounts" [appFieldError]="fieldErrors['source']" /></div>
            <div class="form-field"><label for="add_target">Target account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="transfer!.target" id="add_target" name="target" required placeholder="Choose a target" [options]="accounts" [appFieldError]="fieldErrors['target']" /></div>
        </div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Save transfer</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div></form>
    </app-ui-panel>
    <app-ui-panel *ngIf="!addingTransfer && transfer" heading="Edit transfer">
        <p class="editor-copy">Track transactions between your own accounts.</p>
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()"><div class="form-grid">
            <div class="form-field"><label for="date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="transfer.date" id="date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
            <div class="form-field"><label for="amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="transfer.amount" id="amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
            <div class="form-field"><label for="source">Source account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="transfer.source" id="source" name="source" required placeholder="Choose a source" [options]="accounts" [appFieldError]="fieldErrors['source']" /></div>
            <div class="form-field"><label for="target">Target account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="transfer.target" id="target" name="target" required placeholder="Choose a target" [options]="accounts" [appFieldError]="fieldErrors['target']" /></div>
        </div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Update transfer</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div><div class="destructive-section"><button data-variant="danger" [disabled]="submission.pending" type="button" (click)="onDelete()">Delete transfer</button></div></form>
    </app-ui-panel>
</div>
