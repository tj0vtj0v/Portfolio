<p *ngIf="submission.pending" role="status">Saving changes…</p>
<div *ngIf="!(transfer || addingTransfer)">
    <ag-grid-angular
        appGridFit
        (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)"
        [columnDefs]="columnDefs"
        [domLayout]="'autoHeight'"
        [paginationPageSizeSelector]="[10, 20, 50]"
        [paginationPageSize]="10"
        [pagination]="true"
        [rowData]="transfers"
        class="ag-theme-alpine"
        style="width: 100%; height: 100%;"
    />
    <button [disabled]="submission.pending" (click)="onAdd()">Add Transfer</button>
</div>

<div *ngIf="addingTransfer">
    <h3>Add Transfer</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()">
        <div>
            <label for="add_date">Date</label>
            <input [disabled]="submission.pending" [(ngModel)]="transfer!.date" id="add_date" name="date" required type="date"/>
        </div>
        <div>
            <label for="add_amount">Amount</label>
            <input [disabled]="submission.pending" [(ngModel)]="transfer!.amount" id="add_amount" name="amount" required type="text" numberFormatter/>
        </div>
        <div>
            <label for="add_source">Source</label>
            <select [disabled]="submission.pending" [(ngModel)]="transfer!.source" id="add_source" name="source" required>
                <option *ngFor="let account of accounts" [ngValue]="account">
                    {{ account.name }}
                </option>
            </select>
        </div>
        <div>
            <label for="add_target">Target</label>
            <select [disabled]="submission.pending" [(ngModel)]="transfer!.target" id="add_target" name="target" required>
                <option *ngFor="let account of accounts" [ngValue]="account">
                    {{ account.name }}
                </option>
            </select>
        </div>

        <button [disabled]="submission.pending" type="submit">Save</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>

<div *ngIf="!addingTransfer && transfer">
    <h3>Edit Transfer</h3>
    <form [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()">
        <div>
            <label for="date">Date</label>
            <input [disabled]="submission.pending" [(ngModel)]="transfer!.date" id="date" name="date" required type="date"/>
        </div>
        <div>
            <label for="amount">Amount</label>
            <input [disabled]="submission.pending" [(ngModel)]="transfer!.amount" id="amount" name="amount" required type="text" numberFormatter/>
        </div>
        <div>
            <label for="source">Source</label>
            <select [disabled]="submission.pending" [(ngModel)]="transfer!.source" id="source" name="source" required>
                <option *ngFor="let account of accounts" [ngValue]="account">
                    {{ account.name }}
                </option>
            </select>
        </div>
        <div>
            <label for="target">Target</label>
            <select [disabled]="submission.pending" [(ngModel)]="transfer!.target" id="target" name="target" required>
                <option *ngFor="let account of accounts" [ngValue]="account">
                    {{ account.name }}
                </option>
            </select>
        </div>

        <button [disabled]="submission.pending" type="submit">Update</button>
    </form>

    <button [disabled]="submission.pending" (click)="reset()">Back</button>
    <button [disabled]="submission.pending" (click)="onDelete()">Delete Transfer</button>

    <p *ngIf="statusMessage != ''" class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
</div>
