<div class="accounting-page">
    <app-ui-page-header heading="Income" description="Manage your incoming money."><app-amount-privacy-toggle title-actions />
        <button *ngIf="!(income || addingIncome) && !loading && !loadError" data-variant="primary" type="button" (click)="onAdd()">Add income</button>
    </app-ui-page-header>
    <app-ui-skeleton *ngIf="loading" layout="table" message="Loading incomes..." />
    <app-ui-feedback *ngIf="loadError" kind="error" [message]="loadError" />
    <button *ngIf="loadError" type="button" (click)="load()">Retry</button>
    <app-ui-feedback *ngIf="submission.pending" kind="pending" message="Saving changes…" />
    <app-ui-feedback *ngIf="!loading && !loadError && !incomes.length && !income" kind="info" message="No incomes have been recorded." />
    <app-ui-panel *ngIf="!(income || addingIncome) && !loading && !loadError" heading="Income records"><div panel-actions class="grid-toolbar"><button type="button" class="filter-reset" title="Reset filters to current month" aria-label="Reset filters to current month" (click)="resetFilters()"><span aria-hidden="true">↺</span> Reset filters</button></div><div class="grid-wrap"><ag-grid-angular appGridFit (gridReady)="onGridReady($event)" (filterChanged)="saveGridFilters($event.api)" (appGridActivate)="onRowClicked($event)" [columnDefs]="columnDefs" [domLayout]="'autoHeight'" [paginationPageSizeSelector]="[10,50,100,1000]" [paginationPageSize]="50" [pagination]="true" [rowData]="incomes" style="width:100%;height:100%" /></div></app-ui-panel>
    <app-ui-panel *ngIf="addingIncome" heading="Add income">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onSave()"><div class="form-grid">
            <div class="form-field"><label for="add_date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="income!.date" id="add_date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
            <div class="form-field"><label for="add_amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="income!.amount" id="add_amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
            <div class="form-field form-field--wide"><label for="add_reason">Reason</label><input [disabled]="submission.pending" [(ngModel)]="income!.reason" id="add_reason" name="reason" required type="text" [appFieldError]="fieldErrors['reason']"></div>
            <div class="form-field form-field--wide"><label for="add_account">Account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="income!.account" id="add_account" name="account" required placeholder="Choose an account" [options]="accounts" [appFieldError]="fieldErrors['account']" /></div>
        </div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Save income</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div></form>
    </app-ui-panel>
    <app-ui-panel *ngIf="!addingIncome && income" heading="Edit income">
        <form class="form-page" [attr.aria-busy]="submission.pending" (ngSubmit)="onUpdate()"><div class="form-grid">
            <div class="form-field"><label for="date">Date</label><app-ui-date-input [disabled]="submission.pending" [(ngModel)]="income.date" id="date" name="date" required [appFieldError]="fieldErrors['date']" /></div>
            <div class="form-field"><label for="amount">Amount</label><input [disabled]="submission.pending" [(ngModel)]="income.amount" id="amount" name="amount" required type="text" inputmode="decimal" numberFormatter [appFieldError]="fieldErrors['amount']"></div>
            <div class="form-field form-field--wide"><label for="reason">Reason</label><input [disabled]="submission.pending" [(ngModel)]="income.reason" id="reason" name="reason" required type="text" [appFieldError]="fieldErrors['reason']"></div>
            <div class="form-field form-field--wide"><label for="account">Account</label><app-ui-select [disabled]="submission.pending" [(ngModel)]="income.account" id="account" name="account" required placeholder="Choose an account" [options]="accounts" [appFieldError]="fieldErrors['account']" /></div>
        </div><div class="form-actions"><button data-variant="primary" [disabled]="submission.pending" type="submit">Update income</button><button [disabled]="submission.pending" type="button" (click)="reset()">Cancel</button></div><div class="destructive-section"><button data-variant="danger" [disabled]="submission.pending" type="button" (click)="onDelete()">Delete income</button></div></form>
    </app-ui-panel>
</div>
