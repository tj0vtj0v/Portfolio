<div class="banking-dashboard">
    <app-ui-page-header eyebrow="Workspace" heading="Banking" description="Review imported bank balances and transactions. Banking data is read-only here." />
    <app-date-range (rangeChange)="update($event)" />
    <app-ui-skeleton *ngIf="loading" layout="banking" message="Loading banking data…" />
    <app-ui-feedback *ngIf="errorMessage" kind="error" [message]="errorMessage" />
    <button *ngIf="errorMessage" type="button" (click)="loadData()">Retry</button>
    <app-ui-panel *ngIf="!loading && !errorMessage" heading="Balance history" eyebrow="Selected period">
        <app-chart-card [options]="balance_chart" emptyMessage="No balance history is available for this period." />
    </app-ui-panel>
</div>
